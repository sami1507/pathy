version: 2
updates:
  # Android and Kotlin libraries (version catalog and build files)
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      androidx-and-compose:
        patterns: ["androidx.*", "org.jetbrains.compose*"]
      firebase:
        patterns: ["com.google.firebase*", "com.google.gms*"]
    labels: [dependencies]

  # Cloud Functions
  - package-ecosystem: npm
    directory: /functions
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    labels: [dependencies]

  # The actions used by the workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    labels: [dependencies]
