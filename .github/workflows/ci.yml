name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Plain Kotlin on the JVM: GPS filtering, route following, OpenStreetMap parsing, trail assessment, GPX.
  # Needs no accounts and no secrets, so it runs on every push and every pull request.
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Core tests
        run: ./gradlew :core:test --console=plain
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-report
          path: ~/pathy-build/core/reports

  # The Android app needs the Mapbox SDK (downloaded with a secret token) and a Firebase config.
  # Set the repository variable ANDROID_BUILD=true and the secrets below to enable this job.
  app:
    if: ${{ vars.ANDROID_BUILD == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ORG_GRADLE_PROJECT_MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
      MAPBOX_PUBLIC_TOKEN: ${{ secrets.MAPBOX_PUBLIC_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Firebase config
        run: |
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json
      - name: Unit tests, lint and debug build
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --console=plain
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-reports
          path: |
            ~/pathy-build/app/reports
            ~/pathy-build/app/test-results
